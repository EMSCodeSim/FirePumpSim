name: Android Play Compliance

on:
  pull_request:
    paths:
      - 'android/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'lib/**'
      - '.github/workflows/android-play-compliance.yml'
  workflow_dispatch:

jobs:
  build-android-appbundle:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14'

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Configure Flutter SDK for Gradle
        run: printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > android/local.properties

      - name: Verify Play Billing 8+
        run: |
          gradle -p android :app:dependencies --configuration releaseRuntimeClasspath > android/billing-dependencies.txt
          cat android/billing-dependencies.txt
          if ! grep -Eq 'com\.android\.billingclient:billing:[89]\.' android/billing-dependencies.txt; then
            echo 'Google Play Billing Library 8.0.0 or later was not resolved.'
            exit 1
          fi

      - name: Build release app bundle
        run: gradle -p android :app:bundleRelease
