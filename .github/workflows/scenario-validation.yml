name: Scenario Validation

on:
  pull_request:
    paths:
      - 'assets/scenarios/**'
      - 'tool/validate_scenarios.py'
      - '.github/workflows/scenario-validation.yml'
  workflow_dispatch:

jobs:
  validate-scenarios:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validate scenario JSON and answer keys
        run: python tool/validate_scenarios.py
