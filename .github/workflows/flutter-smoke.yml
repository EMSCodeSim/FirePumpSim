name: Flutter smoke build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build web startup target
        run: flutter build web --release
